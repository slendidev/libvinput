name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  unix:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            library: libvinput.so
          - os: macos-14
            platform: macos-universal
            library: libvinput.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libevdev-dev libx11-dev libxdo-dev libxtst-dev libxkbcommon-dev pkg-config

      - name: Build
        run: make -j2 all

      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
          LIBRARY: ${{ matrix.library }}
        run: |
          package="libvinput-${GITHUB_REF_NAME}-${PLATFORM}"
          mkdir -p "dist/${package}/include" "dist/${package}/lib/pkgconfig"
          cp "$LIBRARY" "dist/${package}/lib/"
          cp src/libvinput.h "dist/${package}/include/"
          cp libvinput.pc "dist/${package}/lib/pkgconfig/"
          cp README.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "$package"

      - uses: actions/upload-artifact@v4
        with:
          name: libvinput-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Package (windows-x86_64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install make
        shell: pwsh
        run: choco install make --yes --no-progress

      - name: Build
        shell: cmd
        run: make SHELL=cmd.exe all

      - name: Package
        shell: pwsh
        run: |
          $package = "libvinput-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Force "dist/$package/include", "dist/$package/lib" | Out-Null
          Copy-Item libvinput.dll, vinput.lib "dist/$package/lib/"
          Copy-Item src/libvinput.h "dist/$package/include/"
          Copy-Item README.md, LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: libvinput-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [unix, windows]
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Notify the Python bindings repo so it can pull these new binaries and cut
      # a matching release. The target repo defaults to the upstream bindings repo
      # but can be overridden per-fork with a `LIBVINPUTPY_REPO` repository
      # variable. Requires a PAT (LIBVINPUTPY_DISPATCH_TOKEN) with `contents:
      # write` on that repo stored as a secret here. If the secret is absent this
      # step is skipped, and the bindings repo's daily scheduled job will pick up
      # the release within a day instead.
      - name: Notify Python bindings repo of new release
        env:
          DISPATCH_TOKEN: ${{ secrets.LIBVINPUTPY_DISPATCH_TOKEN }}
          BINDINGS_REPO: ${{ vars.LIBVINPUTPY_REPO || 'xslendix/libvinput.py' }}
        if: env.DISPATCH_TOKEN != ''
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${BINDINGS_REPO}/dispatches" \
            -d "{\"event_type\":\"libvinput-release\",\"client_payload\":{\"tag\":\"${GITHUB_REF_NAME}\"}}"
